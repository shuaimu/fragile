[workspace]
resolver = "2"
exclude = ["vendor"]
members = [
    "crates/fragile-cli",
    "crates/fragile-common",
    "crates/fragile-clang",
    "crates/fragile-parser-core",
    "crates/fragile-runtime",
    "crates/fragile-driver",
    "crates/fragile-build",
    "crates/fragile-cargo",
    "crates/fragile-ast-exporter",
    "crates/fragile-stl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
fragile-common = { path = "crates/fragile-common" }
fragile-clang = { path = "crates/fragile-clang" }
fragile-parser-core = { path = "crates/fragile-parser-core" }
fragile-runtime = { path = "crates/fragile-runtime" }
fragile-driver = { path = "crates/fragile-driver" }
fragile-build = { path = "crates/fragile-build" }
fragile-cargo = { path = "crates/fragile-cargo" }
fragile-ast-exporter = { path = "crates/fragile-ast-exporter" }

# Clang integration - using clang_18_0 feature (compatible with libclang 19)
clang-sys = { version = "1.8", features = ["clang_18_0"] }

# Runtime support
libc = "0.2"

# Error handling & diagnostics
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
smol_str = "0.3"
rustc-hash = "2"
indexmap = "2"

# Testing
insta = "1"

[profile.release]
lto = true
codegen-units = 1

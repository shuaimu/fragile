[package]
name = "fragile-clang"
description = "Clang AST parsing and MIR conversion for Fragile compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Clang bindings - using clang-sys for low-level access
clang-sys.workspace = true

# AST exporter using LibTooling for template instantiation support
fragile-ast-exporter = { path = "../fragile-ast-exporter" }
fragile-parser-core.workspace = true
fragile-stl = { path = "../fragile-stl" }

# Error handling
miette.workspace = true
thiserror.workspace = true

# Utilities
smol_str.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
fragile-parser-clang = { path = "../fragile-parser-clang" }
fragile-parser-core = { workspace = true }

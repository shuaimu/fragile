[package]
name = "fragile-ast-exporter"
description = "C++ AST exporter using Clang LibTooling for Fragile compiler"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
# CBOR serialization
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_bytes = "0.11"

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Utilities
rustc-hash = "2"

[build-dependencies]
cmake = "0.1"
bindgen = "0.70"
cc = "1"

[dev-dependencies]
tempfile = "3"

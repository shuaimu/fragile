[package]
name = "fragile-ast-exporter"
description = "C++ AST exporter using Clang LibTooling for Fragile compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
# CBOR serialization
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_bytes = "0.11"

# Error handling
miette.workspace = true
thiserror.workspace = true

# Utilities
rustc-hash.workspace = true

[build-dependencies]
cmake = "0.1"
bindgen = "0.70"
cc = "1"

[dev-dependencies]
tempfile = "3"

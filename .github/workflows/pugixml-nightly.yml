name: Pugixml Nightly Matrix

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu

jobs:
  pugixml-nightly-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - test_real_world_pugixml_fixture_checkout_is_pinned
          - test_real_world_pugixml_make_test_command_plan_generation
          - test_real_world_pugixml_native_make_test_no_stl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev llvm-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-action@stable

      - name: Run ignored pugixml real-world matrix test
        run: |
          cargo test -p fragile-clang --test real_world_pugixml_tests ${{ matrix.test_name }} -- --ignored --nocapture --test-threads=1

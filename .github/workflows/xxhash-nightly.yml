name: Xxhash Nightly Matrix

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu

jobs:
  xxhash-nightly-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - test_real_world_xxhash_make_xxhsum_with_fragilec_driver_passthrough
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev llvm-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run ignored xxhash real-world matrix test
        run: |
          cargo test -p fragile-clang --test real_world_xxhash_tests ${{ matrix.test_name }} -- --ignored --nocapture --test-threads=1

name: Rapidjson Nightly Matrix

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu

jobs:
  rapidjson-nightly-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - test_real_world_rapidjson_fixture_checkout_is_pinned
          - test_real_world_rapidjson_no_stl_command_plan_generation
          - test_real_world_rapidjson_native_no_stl_examples_baseline
          - test_real_world_rapidjson_fragilec_native_no_stl_examples_baseline
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev llvm-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run ignored rapidjson real-world matrix test
        run: |
          cargo test -p fragile-clang --test real_world_rapidjson_tests ${{ matrix.test_name }} -- --ignored --nocapture --test-threads=1

        echo "APT install failed after 3 attempts" >&2
        exit 1

    - name: Setup Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Run zlib parity smoke tests (local fixture)
      run: |
        cargo test -p fragile-clang --test real_world_zlib_tests test_make_test_exit_status_parity_local_fixture -- --nocapture
        cargo test -p fragile-clang --test real_world_zlib_tests test_make_test_stdout_stderr_parity_local_fixture -- --nocapture
        cargo test -p fragile-clang --test real_world_zlib_tests test_make_test_artifact_behavior_parity_local_fixture -- --nocapture


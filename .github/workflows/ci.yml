name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu
  FRAGILE_ROOT: ${{ github.workspace }}

jobs:
  # Basic build and test with stable Rust
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Initialize vendored libc++ headers
      run: git submodule update --init --depth 1 vendor/llvm-project

    - name: Install system dependencies
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          echo "APT install attempt ${attempt}/3"
          if timeout 300s sudo apt-get update -o Acquire::Retries=3 \
            && timeout 300s sudo apt-get install -y --no-install-recommends libclang-dev libclang-cpp-dev llvm-dev; then
            exit 0
          fi
          if [ "${attempt}" -lt 3 ]; then
            echo "Retrying apt install after transient failure..."
            sleep 10
          fi
        done
        echo "APT install failed after 3 attempts" >&2
        exit 1

    - name: Setup Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --verbose

    - name: Create legacy workspace symlink for exporter tests
      run: |
        sudo mkdir -p /home/shuai/workspace
        sudo ln -sfn "${GITHUB_WORKSPACE}" /home/shuai/workspace/fragile

    - name: Run tests
      run: cargo test --verbose

  # Clippy lints
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          echo "APT install attempt ${attempt}/3"
          if timeout 300s sudo apt-get update -o Acquire::Retries=3 \
            && timeout 300s sudo apt-get install -y --no-install-recommends libclang-dev libclang-cpp-dev llvm-dev; then
            exit 0
          fi
          if [ "${attempt}" -lt 3 ]; then
            echo "Retrying apt install after transient failure..."
            sleep 10
          fi
        done
        echo "APT install failed after 3 attempts" >&2
        exit 1

    - name: Setup Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Run clippy
      run: cargo clippy -- -D warnings
      continue-on-error: true  # Don't fail build on clippy warnings for now

  # Format check
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check
      continue-on-error: true  # Don't fail build on formatting for now

  # Deterministic zlib parity smoke lane (local fixture only)
  zlib-smoke-parity:

            && timeout 300s sudo apt-get install -y --no-install-recommends libclang-dev libclang-cpp-dev llvm-dev; then
            exit 0
          fi
          if [ "${attempt}" -lt 3 ]; then
            echo "Retrying apt install after transient failure..."
            sleep 10

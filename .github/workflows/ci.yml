name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: /usr/lib/x86_64-linux-gnu

jobs:
  # Basic build and test with stable Rust
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev llvm-dev

    - name: Setup Rust stable
      uses: dtolnay/rust-action@stable

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  # Clippy lints
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev llvm-dev

    - name: Setup Rust stable
      uses: dtolnay/rust-action@stable
      with:
        components: clippy

    - name: Run clippy
      run: cargo clippy -- -D warnings
      continue-on-error: true  # Don't fail build on clippy warnings for now

  # Format check
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust stable
      uses: dtolnay/rust-action@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check
      continue-on-error: true  # Don't fail build on formatting for now

  # Deterministic zlib parity smoke lane (local fixture only)
  zlib-smoke-parity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev llvm-dev

    - name: Setup Rust stable
      uses: dtolnay/rust-action@stable

    - name: Run zlib parity smoke tests (local fixture)
      run: |
        cargo test -p fragile-clang --test real_world_zlib_tests test_make_test_exit_status_parity_local_fixture -- --nocapture
        cargo test -p fragile-clang --test real_world_zlib_tests test_make_test_stdout_stderr_parity_local_fixture -- --nocapture
        cargo test -p fragile-clang --test real_world_zlib_tests test_make_test_artifact_behavior_parity_local_fixture -- --nocapture

  # Deterministic tinyxml2 parity smoke lane (local fixture only)
  tinyxml2-smoke-parity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev llvm-dev

    - name: Setup Rust stable
      uses: dtolnay/rust-action@stable

    - name: Run tinyxml2 parity smoke test (local fixture)
      run: |
        cargo test -p fragile-clang --test real_world_tinyxml2_tests test_make_test_command_subset_parity_local_fixture_success -- --nocapture

  # Deterministic pugixml baseline smoke lane (local fixture only)
  pugixml-smoke-baseline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev llvm-dev

    - name: Setup Rust stable
      uses: dtolnay/rust-action@stable

    - name: Run pugixml baseline smoke tests (local fixture)
      run: |
        cargo test -p fragile-clang --test real_world_pugixml_tests test_make_test_no_stl_local_fixture_success -- --nocapture
        cargo test -p fragile-clang --test real_world_pugixml_tests test_make_test_command_plan_local_fixture_success -- --nocapture
        cargo test -p fragile-clang --test real_world_pugixml_tests test_fragile_pugixml_single_tu_replay_local_fixture_success -- --nocapture

  # Deterministic rapidjson baseline smoke lane (local fixture only)
  rapidjson-smoke-baseline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev llvm-dev

    - name: Setup Rust stable
      uses: dtolnay/rust-action@stable

    - name: Run rapidjson baseline smoke tests (local fixture)
      run: |
        cargo test -p fragile-clang --test real_world_rapidjson_tests test_rapidjson_native_no_stl_examples_local_fixture_success -- --nocapture
        cargo test -p fragile-clang --test real_world_rapidjson_tests test_rapidjson_no_stl_command_plan_local_fixture_success -- --nocapture
        cargo test -p fragile-clang --test real_world_rapidjson_tests test_rapidjson_fragile_condense_single_tu_replay_local_fixture_success -- --nocapture
